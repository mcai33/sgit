name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable
  PLATFORM: macos-arm64

jobs:
  build:
    name: Build macOS ARM64
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Check release version and architecture
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+$ ]]
          version=$(node -p 'require("./desktop/src-tauri/tauri.conf.json").version')
          [[ "$version" == "${GITHUB_REF_NAME#v}.0" ]]
          [[ "$(uname -m)" == arm64 ]]

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Test and build CLI
        shell: bash
        run: |
          cargo test --locked
          cargo build --locked --release --bin sgit

      - name: Install and check frontend
        working-directory: desktop
        shell: bash
        run: |
          npm ci
          npm run check

      - name: Bundle desktop application
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri -- build --ci --bundles dmg -- --locked

      - name: Collect macOS installer and CLI
        shell: bash
        run: |
          mkdir -p release
          shopt -s nullglob
          installers=(desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          [[ ${#installers[@]} -eq 1 ]]
          cp "${installers[0]}" "release/sgit-$GITHUB_REF_NAME-$PLATFORM.dmg"
          [[ "$(target/release/sgit --version)" == "sgit ${GITHUB_REF_NAME#v}" ]]
          tar -czf "release/sgit-cli-$GITHUB_REF_NAME-$PLATFORM.tar.gz" -C target/release sgit

      - uses: actions/upload-artifact@v7
        with:
          name: sgit-macos-arm64
          path: release/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sgit-macos-arm64
          path: release

      - name: Publish macOS ARM64 packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/sgit-$GITHUB_REF_NAME-$PLATFORM.dmg" \
            "release/sgit-cli-$GITHUB_REF_NAME-$PLATFORM.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "sgit ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes '提供 macOS Apple Silicon（ARM64）桌面安装包和 CLI。桌面端需要系统 Git。macOS 安装包使用临时签名，未经 Apple 公证。'
